<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        :root {
            --bg: #020817;
            --panel: rgba(15, 23, 42, 0.78);
            --line: rgba(148, 163, 184, 0.22);
            --text: #e2e8f0;
            --muted: #a5b4cf;
            --accent: #38bdf8;
            --accent-2: #34d399;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(15,23,42,0.9);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 16px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(56,189,248,0.12);
            border: 1px solid rgba(56,189,248,0.22);
            color: #bae6fd;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge::before {
            content: "";
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent-2); box-shadow: 0 0 0 5px rgba(52,211,153,.12);
        }

        .status {
            color: var(--muted);
            font-weight: 600;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .weather-panel {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: min(300px, calc(100% - 36px));
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 18px 30px rgba(0,0,0,0.25);
            z-index: 500;
        }

        .weather-panel h3 {
            margin: 0 0 10px;
            font-size: 0.82rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .weather-main {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }

        .weather-temp {
            font-size: 2.3rem; font-weight: 800;
        }

        .weather-desc {
            font-size: 0.96rem; color: var(--muted); margin-top: 6px;
        }

        .weather-meta {
            margin-top: 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            padding-top: 12px; border-top: 1px solid var(--line);
            color: var(--muted); font-size: 0.8rem;
        }

        .leaflet-control-zoom a {
            background: rgba(15, 23, 42, 0.9) !important;
            color: var(--text) !important;
            border-color: rgba(148,163,184,.22) !important;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="badge">Target</div>
        <div class="status"><span id="display-id"></span></div>
    </div>
    <div id="map"></div>

    <div class="weather-panel">
        <h3>Weather</h3>
        <div class="weather-main">
            <div>
                <div id="weather-temp" class="weather-temp">--°</div>
                <div id="weather-desc" class="weather-desc">Loading…</div>
            </div>
            <div id="weather-icon" style="font-size:2.3rem;">⛅</div>
        </div>
        <div class="weather-meta">
            <div>Wind: <strong id="weather-wind">--</strong></div>
            <div>Humidity: <strong id="weather-humidity">--</strong></div>
            <div>Precip: <strong id="weather-precip">--</strong></div>
            <div>Last: <strong id="weather-time">--</strong></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const displayId = document.querySelector('#display-id')
        const id = new URLSearchParams(location.search).get('id')
        const initial = JSON.parse(decodeURIComponent("{{ data }}"))
        const latLng = initial && typeof initial === 'object' && Number.isFinite(initial.lat) && Number.isFinite(initial.lng)
            ? [initial.lat, initial.lng]
            : [0, 0]

        const map = L.map('map').setView(latLng, 12)
        const marker = L.marker(latLng).addTo(map)

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map)

        const socket = io('', {
            secure: location.protocol === 'https:',
            path: '/socket.io',
            transports: ['websocket']
        })

        function formatTime(ts) {
            if (!ts) return 'now'
            const d = new Date(Number(ts))
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }

        function getWeatherIcon(code) {
            const map = {
                0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                45: '🌫️', 48: '🌫️', 51: '🌦️', 53: '🌦️', 55: '🌧️',
                56: '🌧️', 57: '🌧️', 61: '🌧️', 63: '🌧️', 65: '🌧️',
                66: '🌧️', 67: '🌧️', 71: '🌨️', 73: '🌨️', 75: '🌨️',
                77: '🌨️', 80: '🌦️', 81: '🌧️', 82: '🌧️', 85: '🌨️',
                86: '🌨️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
            }
            return map[code] || '🌤️'
        }

        async function loadWeather(lat, lng) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=auto`
            try {
                const response = await fetch(url)
                if (!response.ok) throw new Error('weather failed')
                const data = await response.json()
                const current = data.current || {}
                const code = current.weather_code ?? 0
                const desc = {
                    0: 'Clear sky', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy',
                    45: 'Foggy', 48: 'Rime fog', 51: 'Light drizzle', 53: 'Drizzle',
                    55: 'Heavy drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
                    71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 80: 'Rain showers',
                    81: 'Heavy showers', 82: 'Thunderstorm rain', 95: 'Thunderstorm',
                    96: 'Thunderstorm with hail', 99: 'Severe thunderstorm'
                }[code] || 'Conditions'

                document.getElementById('weather-temp').textContent = `${Math.round(current.temperature_2m ?? 0)}°C`
                document.getElementById('weather-desc').textContent = desc
                document.getElementById('weather-icon').textContent = getWeatherIcon(code)
                document.getElementById('weather-wind').textContent = `${Math.round(current.wind_speed_10m ?? 0)} km/h`
                document.getElementById('weather-humidity').textContent = `${Math.round(current.relative_humidity_2m ?? 0)}%`
                document.getElementById('weather-precip').textContent = `${Number(current.precipitation ?? 0).toFixed(1)} mm`
                document.getElementById('weather-time').textContent = formatTime(Date.now())
            } catch (err) {
                document.getElementById('weather-desc').textContent = 'Weather unavailable'
                document.getElementById('weather-icon').textContent = '⚠️'
            }
        }

        displayId.textContent = id || 'Unknown target'

        if (latLng[0] && latLng[1]) {
            loadWeather(latLng[0], latLng[1])
        }

        socket.on('map-data', data => {
            if (data.id == id) {
                displayId.textContent = `${id} — updating`
                marker.setLatLng([data.lat, data.lng])
                map.setView([data.lat, data.lng], 12)
                loadWeather(data.lat, data.lng)

                setTimeout(() => {
                    displayId.textContent = id
                }, 2000)
            }
        })
    </script>
</body>

</html>
